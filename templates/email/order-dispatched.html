<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
        <tr>
            <td style="padding: 30px; text-align: center; background-color: #ffffff; border-bottom: 4px solid #166534;">
                <img src="{{logoUrl}}" alt="{{siteName}}" style="max-width: 220px; height: auto;">
            </td>
        </tr>
        <tr>
            <td style="padding: 40px 30px;">
                <h2 style="color: #166534; margin: 0 0 20px 0; font-size: 22px;">Your order's on its way, {{customerName}}!</h2>
                <p style="color: #666; font-size: 16px; line-height: 1.5; margin: 0 0 20px 0;">
                    Order <strong>{{orderRef}}</strong> has been dispatched.
                </p>

                {{trackingLine}}

                <p style="color: #999; font-size: 14px; line-height: 1.5; margin: 0;">
                    If you have any questions, just reply to this email.
                </p>
            </td>
        </tr>
        <tr>
            <td style="padding: 20px 30px; background-color: #f8f8f8; text-align: center;">
                <p style="color: #999; font-size: 12px; margin: 0;">
                    &copy; {{siteName}} - This is an automated message.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
